name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-surface:
    name: Canonical Package Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Verify surviving package set
        shell: bash
        run: |
          actual="$(go list ./... | LC_ALL=C sort)"
          expected='github.com/wippyai/go-lua
          github.com/wippyai/go-lua/compiler/ast
          github.com/wippyai/go-lua/compiler/bytecode
          github.com/wippyai/go-lua/compiler/parse
          github.com/wippyai/go-lua/compiler/parse/numparse
          github.com/wippyai/go-lua/compiler/source
          github.com/wippyai/go-lua/inspect
          github.com/wippyai/go-lua/pm'
          test "$actual" = "$expected"

      - name: Reject dependencies on quarantined systems
        shell: bash
        run: |
          deps="$(go list -deps ./...)"
          if printf '%s\n' "$deps" | grep -E '/(analysis|types|validate|__legacy)(/|$)'; then
            echo 'canonical packages depend on a quarantined system' >&2
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ runner.temp }}/go-build
      GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.8.0
          only-new-issues: false
          args: --timeout=10m --enable=errcheck,govet,staticcheck,unused,ineffassign ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run tests
        run: |
          go build ./...
          go test -count=1 -timeout 120s ./...

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run race tests
        env:
          GORACE: "halt_on_error=1"
        run: go test -race -count=1 -timeout 120s ./...
